<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehmet Can Durular | Online Randevu</title>
<meta name="description" content="Mehmet Can Durular berber. Online randevu alın.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0e0d; --card:#1a1816; --card2:#221f1c; --line:#33302b;
    --gold:#d4a24c; --gold2:#e8bd6a; --text:#f3eee6; --muted:#9d958a;
    --red:#c8553d; --green:#5fa36b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;color:var(--text)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}

  header{text-align:center;padding:38px 0 26px;position:relative}
  .pole{width:14px;height:54px;margin:0 auto 14px;border-radius:7px;border:2px solid var(--gold);
    background:repeating-linear-gradient(135deg,#c8553d 0 7px,#f3eee6 7px 14px,#2f5d8a 14px 21px,#f3eee6 21px 28px);
    background-size:100% 40px;animation:spin 2.2s linear infinite}
  @keyframes spin{to{background-position:0 40px}}
  h1{font-family:Oswald,sans-serif;font-weight:700;font-size:34px;letter-spacing:3px;text-transform:uppercase;line-height:1.05}
  h1 span{display:block;color:var(--gold);font-size:15px;letter-spacing:6px;font-weight:500;margin-top:6px}
  .meta{color:var(--muted);font-size:13px;margin-top:12px}
  .meta b{color:var(--text);font-weight:500}

  .steps{display:flex;gap:6px;margin:4px 0 18px}
  .steps div{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.3s}
  .steps div.on{background:var(--gold)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .card h2{font-family:Oswald,sans-serif;font-weight:600;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .card h2 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#111;font-size:13px;display:grid;place-items:center}
  .card.locked{opacity:.4;pointer-events:none}

  .svc{display:grid;gap:8px}
  .svc button{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--card2);text-align:left;transition:.15s}
  .svc button:hover{border-color:#5a5248}
  .svc button.sel{border-color:var(--gold);background:#2a2318}
  .svc small{color:var(--gold);font-weight:600}

  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .days button{flex:0 0 62px;padding:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--card2);text-align:center;transition:.15s}
  .days button b{display:block;font-family:Oswald,sans-serif;font-size:22px;font-weight:600;line-height:1.1}
  .days button span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .days button.sel{border-color:var(--gold);background:var(--gold);color:#111}
  .days button.sel span{color:#3a2c12}
  .days button:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}

  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slots button{padding:11px 0;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-weight:600;font-variant-numeric:tabular-nums;transition:.15s}
  .slots button:hover:not(:disabled){border-color:var(--gold)}
  .slots button.sel{background:var(--gold);border-color:var(--gold);color:#111}
  .slots button:disabled{color:#5a544c;background:transparent;border-style:dashed;cursor:not-allowed;text-decoration:line-through}
  .hint{color:var(--muted);font-size:13px}
  .legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--card2);border:1px solid var(--line)}
  .legend span.d::before{background:transparent;border-style:dashed}

  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .field{margin-bottom:13px}
  input,textarea{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:10px;outline:none;transition:.15s}
  input:focus,textarea:focus{border-color:var(--gold)}
  textarea{resize:vertical;min-height:64px}

  .summary{background:var(--card2);border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
  .summary dt{color:var(--muted)} .summary dd{font-weight:500}

  .btn{width:100%;padding:15px;border-radius:12px;background:var(--gold);color:#111;font-family:Oswald,sans-serif;font-size:17px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:.15s}
  .btn:hover{background:var(--gold2)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .err{color:#f09a86;font-size:14px;margin:10px 0 0;min-height:1px}

  .done{text-align:center;padding:34px 22px}
  .done .ok{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 16px;font-size:32px;color:#fff}
  .done h2{justify-content:center;font-size:22px}
  .done .code{display:inline-block;margin:6px 0 16px;padding:6px 14px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold);font-weight:600;letter-spacing:1px}
  .done .summary{text-align:left;margin:0 0 18px}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  footer button{color:var(--muted);text-decoration:underline;font-size:12px}

  .loading{display:flex;justify-content:center;padding:20px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:10}
  .modal.open{display:flex}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:640px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .panel-head h3{font-family:Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;font-weight:600}
  .x{font-size:24px;color:var(--muted);line-height:1}
  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stats div{flex:1;background:var(--card2);border-radius:10px;padding:10px;text-align:center}
  .stats b{display:block;font-family:Oswald,sans-serif;font-size:24px;color:var(--gold)}
  .stats span{font-size:12px;color:var(--muted)}
  .dayhead{font-family:Oswald,sans-serif;color:var(--gold);letter-spacing:1px;margin:16px 0 8px;font-size:14px;text-transform:uppercase}
  .appt{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:11px 12px;background:var(--card2);border-radius:10px;margin-bottom:6px}
  .appt .t{font-family:Oswald,sans-serif;font-size:19px;font-weight:600}
  .appt .n{font-weight:600}
  .appt .s{font-size:13px;color:var(--muted)}
  .appt a{color:var(--gold);text-decoration:none}
  .appt.iptal{opacity:.4}
  .appt.iptal .t{text-decoration:line-through}
  .cancel{font-size:12px;padding:6px 10px;border:1px solid #5a3a32;border-radius:8px;color:#f09a86}
  .cancel:hover{background:#3a221c}
  .tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card2);padding:4px;border-radius:11px}
  .tabs button{flex:1;padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
  .tabs button.on{background:var(--gold);color:#111}
  .kslots button{display:flex;flex-direction:column;align-items:center;line-height:1.2}
  .kslots button small{font-size:10px;font-weight:500;margin-top:2px}
  .kslots button.kapali{background:#3a221c;border-color:#c8553d;color:#f09a86}
  .kslots button:disabled{color:#7d766c;border-style:solid;text-decoration:none;background:#1d2a20;border-color:#3d5a43;cursor:not-allowed}
  .kbtns{display:flex;gap:8px;margin-top:14px}
  .kbtns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px}
  .kbtns .kap{border-color:#5a3a32;color:#f09a86}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="pole"></div>
    <h1>Mehmet Can<span>Durular · Berber</span></h1>
    <p class="meta" id="meta">Pazar hariç her gün <b>12:00 – 22:30</b> · Online randevu</p>
  </header>

  <div id="app"><div class="loading"><div class="spin"></div></div></div>

  <footer>
    <p id="footInfo"></p>
    <p style="margin-top:8px"><button id="iptalBtn">Randevumu iptal et</button> · <button id="adminBtn">Yönetici girişi</button></p>
  </footer>
</div>

<div class="modal" id="modal">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ============ API (Google Apps Script) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwE6a2XcGJkxFcge-fhCR_oS3UIktQDu1yoN7dVbbW-bq6ZPsXMXxSSqSDW4Tc3bH0v/exec';
const YAZMA = ['randevuAl','adminIptal','adminKapat','musteriIptal'];
const WA_NO = '905380334646';

async function api(fn, ...args){
  const url = API_URL + '?fn=' + encodeURIComponent(fn) + '&args=' + encodeURIComponent(JSON.stringify(args)) + '&_=' + Date.now();
  let r;
  try { r = await fetch(url, { credentials:'omit' }); }
  catch (e) { if (YAZMA.includes(fn)) throw e; await new Promise(z => setTimeout(z, 800)); r = await fetch(url, { credentials:'omit' }); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.hata || 'Hata');
  return j.data;
}

/* ============ yardımcılar ============ */
const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GUNK = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
function parse(t){ const p=t.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function fmt(d){ return d.toISOString().slice(0,10); }
function uzunTarih(t){ const d=parse(t); return d.getUTCDate()+' '+AY[d.getUTCMonth()]+' '+GUN[d.getUTCDay()]; }
const dk = s => { const p=s.split(':'); return +p[0]*60 + +p[1]; };

/* ============ durum ============ */
let A = null;
const S = { hizmet:null, tarih:null, saat:null, dolu:[], yukleniyor:false };

async function basla(){
  try{
    A = await api('ayarlariGetir');
    const bilgi = [A.telefon && ('☎ <a href="tel:'+esc(A.telefon.replace(/\s/g,''))+'" style="color:var(--gold)">'+esc(A.telefon)+'</a>'), A.adres && esc(A.adres)].filter(Boolean).join('<br>');
    $('#footInfo').innerHTML = bilgi || '&copy; '+esc(A.dukkanAdi);
    const ilk = A.slotlar[0], son = A.slotlar[A.slotlar.length-1];
    $('#meta').innerHTML = (A.kapaliGunler.length ? A.kapaliGunler.map(g=>GUN[g]).join(', ')+' hariç her gün ' : 'Her gün ') + '<b>'+ilk+' – '+ (A.kapanis || '19:00') +'</b> · Son randevu '+son;
    ciz();
  }catch(e){
    $('#app').innerHTML = '<div class="card"><p class="err">Sistem şu an yüklenemedi. Lütfen sayfayı yenileyin.</p></div>';
  }
}

function gunler(){
  const out=[]; const b=parse(A.bugun);
  for(let i=0;i<A.kacGunIleri;i++){
    const d=new Date(b.getTime()+i*86400000);
    out.push({t:fmt(d), gun:d.getUTCDay(), no:d.getUTCDate(), kapali:A.kapaliGunler.includes(d.getUTCDay()), i});
  }
  return out;
}

function ciz(){
  const adim = !S.hizmet?1 : !S.tarih?2 : !S.saat?3 : 4;
  let h = '<div class="steps">'+[1,2,3,4].map(n=>'<div class="'+(n<=adim?'on':'')+'"></div>').join('')+'</div>';

  h += '<div class="card"><h2><i>1</i>Hizmet seçin</h2><div class="svc">'+
    A.hizmetler.map(x=>'<button data-h="'+esc(x.ad)+'" class="'+(S.hizmet===x.ad?'sel':'')+'"><span>'+esc(x.ad)+'</span>'+(x.fiyat?'<small>'+esc(x.fiyat)+'</small>':'')+'</button>').join('')+
    '</div></div>';

  h += '<div class="card '+(S.hizmet?'':'locked')+'"><h2><i>2</i>Gün seçin</h2><div class="days">'+
    gunler().map(g=>'<button data-t="'+g.t+'" '+(g.kapali?'disabled':'')+' class="'+(S.tarih===g.t?'sel':'')+'"><span>'+(g.i===0?'Bugün':g.i===1?'Yarın':GUNK[g.gun])+'</span><b>'+g.no+'</b><span>'+AY[parse(g.t).getUTCMonth()].slice(0,3)+'</span></button>').join('')+
    '</div></div>';

  h += '<div class="card '+(S.tarih?'':'locked')+'"><h2><i>3</i>Saat seçin</h2>';
  if(!S.tarih) h += '<p class="hint">Önce bir gün seçin.</p>';
  else if(S.yukleniyor) h += '<div class="loading"><div class="spin"></div></div>';
  else {
    const bugunMu = S.tarih===A.bugun;
    const slots = A.slotlar.map(s=>{
      const gecti = bugunMu && dk(s) <= dk(A.simdi);
      const dolu = S.dolu.includes(s);
      return {s, kapali: gecti||dolu};
    });
    if(slots.every(x=>x.kapali)) h += '<p class="hint">Bu gün için boş saat kalmadı. Lütfen başka bir gün seçin.</p>';
    else h += '<div class="slots">'+slots.map(x=>'<button data-s="'+x.s+'" '+(x.kapali?'disabled':'')+' class="'+(S.saat===x.s?'sel':'')+'">'+x.s+'</button>').join('')+'</div>'+
      '<div class="legend"><span>Boş</span><span class="d">Dolu</span></div>';
  }
  h += '</div>';

  h += '<div class="card '+(S.saat?'':'locked')+'" id="formCard"><h2><i>4</i>Bilgileriniz</h2>';
  if(S.saat) h += '<dl class="summary"><dt>Hizmet</dt><dd>'+esc(S.hizmet)+'</dd><dt>Tarih</dt><dd>'+uzunTarih(S.tarih)+'</dd><dt>Saat</dt><dd>'+S.saat+'</dd></dl>';
  h += '<form id="f" novalidate>'+
    '<div class="field"><label for="ad">Ad Soyad</label><input id="ad" autocomplete="name" maxlength="60" placeholder="Adınız Soyadınız" value="'+esc(S.ad||'')+'"></div>'+
    '<div class="field"><label for="tel">Telefon</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="05XX XXX XX XX" value="'+esc(S.tel||'')+'"></div>'+
    '<div class="field"><label for="not">Not (isteğe bağlı)</label><textarea id="not" maxlength="200" placeholder="Örn: kısa kesim, yanlar 1 numara">'+esc(S.not||'')+'</textarea></div>'+
    '<button class="btn" id="gonder" type="submit">Randevuyu Onayla</button><p class="err" id="err"></p></form></div>';

  $('#app').innerHTML = h;
}

/* ============ olaylar ============ */
document.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.h){ S.hizmet=b.dataset.h; formKaydet(); ciz(); }
  else if(b.dataset.t){ S.tarih=b.dataset.t; S.saat=null; formKaydet(); await saatleriYukle(); }
  else if(b.dataset.s){ S.saat=b.dataset.s; formKaydet(); ciz(); setTimeout(()=>$('#formCard').scrollIntoView({behavior:'smooth',block:'start'}),50); }
  else if(b.id==='yeni'){ Object.assign(S,{hizmet:null,tarih:null,saat:null,dolu:[]}); A = await api('ayarlariGetir'); ciz(); scrollTo({top:0,behavior:'smooth'}); }
  else if(b.id==='adminBtn'){ adminAc(); }
  else if(b.id==='iptalBtn'){ iptalAc(); }
});

function formKaydet(){
  if($('#ad')) { S.ad=$('#ad').value; S.tel=$('#tel').value; S.not=$('#not').value; }
}

async function saatleriYukle(){
  S.yukleniyor=true; ciz();
  try{ S.dolu = await api('doluSaatler', S.tarih); }catch(e){ S.dolu=[]; }
  S.yukleniyor=false; ciz();
}

document.addEventListener('submit', async e=>{
  if(e.target.id!=='f') return;
  e.preventDefault();
  formKaydet();
  const err=$('#err'); err.textContent='';
  if(!S.saat){ err.textContent='Lütfen önce hizmet, gün ve saat seçin.'; return; }
  if((S.ad||'').trim().length<2){ err.textContent='Lütfen adınızı ve soyadınızı yazın.'; return; }
  const tel=(S.tel||'').replace(/\D/g,'');
  if(tel.length<10||tel.length>12){ err.textContent='Lütfen geçerli bir telefon numarası yazın.'; return; }
  const btn=$('#gonder'); btn.disabled=true; btn.textContent='Kaydediliyor…';
  try{
    const r = await api('randevuAl',{hizmet:S.hizmet,tarih:S.tarih,saat:S.saat,ad:S.ad,telefon:S.tel,not:S.not});
    if(r.ok) basarili(r);
    else {
      if(r.dolu){ S.saat=null; await saatleriYukle(); alertTop(r.mesaj); }
      else { err.textContent=r.mesaj; btn.disabled=false; btn.textContent='Randevuyu Onayla'; }
    }
  }catch(x){ err.textContent='Bağlantı hatası, lütfen tekrar deneyin.'; btn.disabled=false; btn.textContent='Randevuyu Onayla'; }
});

function alertTop(m){
  const c=document.querySelectorAll('.card')[2];
  if(c){ c.insertAdjacentHTML('afterbegin','<p class="err" style="margin:0 0 10px">'+esc(m)+'</p>'); c.scrollIntoView({behavior:'smooth'}); }
}

function basarili(r){
  S.ad=''; S.tel=''; S.not='';
  $('#app').innerHTML = '<div class="card done"><div class="ok">✓</div><h2>Randevunuz alındı</h2>'+
    '<p class="hint">Randevu kodunuz (iptal için saklayın)</p><div class="code">'+esc(r.id)+'</div>'+
    '<dl class="summary"><dt>İsim</dt><dd>'+esc(r.ad)+'</dd><dt>Hizmet</dt><dd>'+esc(r.hizmet)+'</dd><dt>Tarih</dt><dd>'+uzunTarih(r.tarih)+'</dd><dt>Saat</dt><dd>'+r.saat+'</dd></dl>'+
    '<p class="hint" style="margin-bottom:18px">Lütfen randevu saatinizden birkaç dakika önce dükkanda olun. Bu ekranın görüntüsünü alabilirsiniz.</p>'+
    '<a class="btn" style="display:block;text-align:center;text-decoration:none;background:#25d366;color:#fff;margin-bottom:10px" target="_blank" rel="noopener" href="https://wa.me/'+WA_NO+'?text='+encodeURIComponent('Merhaba, '+uzunTarih(r.tarih)+' saat '+r.saat+' için '+r.hizmet+' randevusu aldım. İsim: '+r.ad+' · Kod: '+r.id)+'">WhatsApp\'tan haber ver</a>'+
    '<button class="btn ghost" id="yeni">Yeni randevu al</button></div>';
  scrollTo({top:0,behavior:'smooth'});
}

/* ============ yönetici paneli ============ */
let SIFRE = '';
function modal(h){ $('#panel').innerHTML=h; $('#modal').classList.add('open'); }
function kapat(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal' || e.target.closest('.x')) kapat(); });

function adminAc(){
  modal('<div class="panel-head"><h3>Yönetici girişi</h3><button class="x">×</button></div>'+
    '<form id="af"><div class="field"><label for="sf">Şifre</label><input id="sf" type="password" autocomplete="current-password"></div>'+
    '<button class="btn" type="submit">Giriş</button><p class="err" id="aerr"></p></form>');
  setTimeout(()=>$('#sf').focus(),50);
  $('#af').onsubmit = async e=>{ e.preventDefault(); SIFRE=$('#sf').value; await adminYukle(); };
}

async function adminYukle(){
  let r;
  try{ r = await api('adminListe', SIFRE); }catch(e){ r={ok:false,mesaj:'Bağlantı hatası.'}; }
  if(!r.ok){ if($('#aerr')) $('#aerr').textContent=r.mesaj; else adminAc(); return; }
  const aktif = r.liste.filter(x=>x.durum!=='İptal');
  const bugunSay = aktif.filter(x=>x.tarih===r.bugun).length;
  let h = adminBas('r') + '<div style="text-align:right;margin:-6px 0 10px"><button class="cancel" style="border-color:var(--line);color:var(--text)" id="yenile">Yenile</button></div>'+
    '<div class="stats"><div><b>'+bugunSay+'</b><span>Bugün</span></div><div><b>'+aktif.length+'</b><span>Yaklaşan toplam</span></div></div>';
  if(!r.liste.length) h += '<p class="hint">Yaklaşan randevu yok.</p>';
  let son='';
  r.liste.forEach(x=>{
    if(x.tarih!==son){ son=x.tarih; h+='<div class="dayhead">'+(x.tarih===r.bugun?'Bugün · ':'')+uzunTarih(x.tarih)+'</div>'; }
    const ip = x.durum==='İptal';
    h += '<div class="appt '+(ip?'iptal':'')+'"><div class="t">'+esc(x.saat)+'</div><div><div class="n">'+esc(x.ad)+'</div>'+
      '<div class="s">'+esc(x.hizmet)+' · <a href="tel:'+esc(x.telefon)+'">'+esc(x.telefon)+'</a> · <a target="_blank" rel="noopener" href="https://wa.me/90'+esc(String(x.telefon).replace(/\D/g,'').slice(-10))+'">WhatsApp</a>'+(x.not?' · '+esc(x.not):'')+'</div></div>'+
      (ip?'<span class="s">İptal</span>':'<button class="cancel" data-iptal="'+esc(x.id)+'">İptal et</button>')+'</div>';
  });
  modal(h);
  $('#yenile').onclick = adminYukle;
  document.querySelectorAll('[data-iptal]').forEach(b=>b.onclick = async ()=>{
    if(b.dataset.onay!=='1'){ b.dataset.onay='1'; b.textContent='Emin misin?'; return; }
    b.disabled=true; b.textContent='…';
    await api('adminIptal', SIFRE, b.dataset.iptal);
    await adminYukle();
    if(S.tarih) saatleriYukle();
  });
}

/* ============ müşteri iptali ============ */
function iptalAc(){
  modal('<div class="panel-head"><h3>Randevu iptali</h3><button class="x">×</button></div>'+
    '<p class="hint" style="margin-bottom:12px">Randevu alırken verilen kodu ve telefon numaranızı yazın.</p>'+
    '<form id="mif"><div class="field"><label for="mk">Randevu kodu</label><input id="mk" autocomplete="off" autocapitalize="characters" placeholder="Örn: BMQL2JII" maxlength="12"></div>'+
    '<div class="field"><label for="mt">Telefon</label><input id="mt" type="tel" inputmode="tel" placeholder="05XX XXX XX XX" maxlength="16"></div>'+
    '<button class="btn" type="submit" id="mib">Randevuyu iptal et</button><p class="err" id="mie"></p></form>'+
    (A && A.telefon ? '<p class="hint" style="margin-top:12px">Kodunuzu bulamıyorsanız bizi arayın: '+esc(A.telefon)+'</p>' : ''));
  $('#mif').onsubmit = async e=>{
    e.preventDefault();
    const btn=$('#mib'), er=$('#mie'); er.textContent='';
    if(btn.dataset.onay!=='1'){ btn.dataset.onay='1'; btn.textContent='Emin misiniz? Tekrar dokunun'; return; }
    btn.disabled=true; btn.textContent='İptal ediliyor…';
    let r;
    try{ r = await api('musteriIptal', $('#mk').value, $('#mt').value); }catch(x){ r={ok:false,mesaj:'Bağlantı hatası, tekrar deneyin.'}; }
    if(!r.ok){ er.textContent=r.mesaj; btn.disabled=false; btn.dataset.onay=''; btn.textContent='Randevuyu iptal et'; return; }
    modal('<div class="panel-head"><h3>Randevu iptali</h3><button class="x">×</button></div>'+
      '<div class="done" style="padding:10px 0"><div class="ok">✓</div><h2 style="font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:1px">İptal edildi</h2>'+
      '<p class="hint" style="margin-top:8px">'+esc(r.ad)+' · '+esc(r.hizmet)+'<br>'+uzunTarih(r.tarih)+' · '+esc(r.saat)+'</p></div>');
    if(S.tarih===r.tarih) saatleriYukle();
  };
}

/* ============ saat kapatma ============ */
function adminBas(sekme){
  return '<div class="panel-head"><h3>Yönetim</h3><button class="x">×</button></div>'+
    '<div class="tabs"><button data-sekme="r" class="'+(sekme==='r'?'on':'')+'">Randevular</button><button data-sekme="k" class="'+(sekme==='k'?'on':'')+'">Saat Kapat</button></div>';
}

let KG = null;
async function kapatYukle(t){
  if(t) KG = t;
  if(!KG){ const g = gunler().find(x=>!x.kapali); KG = g ? g.t : A.bugun; }
  modal(adminBas('k') + '<div class="loading"><div class="spin"></div></div>');
  let r;
  try{ r = await api('adminGun', SIFRE, KG); }catch(e){ r = {ok:false, mesaj:'Bağlantı hatası.'}; }
  if(!r.ok){ modal(adminBas('k') + '<p class="err">'+esc(r.mesaj)+'</p>'); return; }
  kapatCiz(r);
}

function kapatCiz(r){
  const bugunMu = KG===A.bugun;
  let h = adminBas('k') +
    '<p class="hint" style="margin-bottom:12px">Gün seç, kapatmak istediğin saate dokun. Kapalı saatlerden müşteri randevu alamaz. Tekrar dokununca açılır.</p>'+
    '<div class="days">'+gunler().map(g=>'<button data-kg="'+g.t+'" '+(g.kapali?'disabled':'')+' class="'+(KG===g.t?'sel':'')+'"><span>'+(g.i===0?'Bugün':g.i===1?'Yarın':GUNK[g.gun])+'</span><b>'+g.no+'</b><span>'+AY[parse(g.t).getUTCMonth()].slice(0,3)+'</span></button>').join('')+'</div>'+
    '<div class="dayhead">'+uzunTarih(KG)+'</div>'+
    '<div class="slots kslots">'+r.slotlar.map(s=>{
      const rv = r.randevulu.includes(s), k = r.kapali.includes(s);
      const gecti = bugunMu && dk(s) <= dk(A.simdi);
      return '<button data-ks="'+s+'" data-k="'+(k?1:0)+'" class="'+(k?'kapali':'')+'" '+(rv||gecti?'disabled':'')+'>'+s+
        '<small>'+(rv?'randevu var':k?'kapalı':gecti?'geçti':'açık')+'</small></button>';
    }).join('')+'</div>'+
    '<div class="kbtns"><button class="kap" id="gunKapat">Tüm günü kapat</button><button id="gunAc">Tüm günü aç</button></div>'+
    '<p class="err" id="kerr"></p>';
  modal(h);
}

async function kapatDegistir(saatler, kapat){
  document.querySelectorAll('.kslots button,.kbtns button').forEach(b=>b.disabled=true);
  let r;
  try{ r = await api('adminKapat', SIFRE, KG, saatler, kapat); }catch(e){ r = {ok:false, mesaj:'Bağlantı hatası, tekrar dene.'}; }
  if(!r.ok){ await kapatYukle(); const e=$('#kerr'); if(e) e.textContent=r.mesaj; return; }
  kapatCiz(r);
  if(S.tarih===KG) saatleriYukle();
}

$('#panel').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.sekme==='r'){ adminYukle(); }
  else if(b.dataset.sekme==='k'){ kapatYukle(); }
  else if(b.dataset.kg){ kapatYukle(b.dataset.kg); }
  else if(b.dataset.ks){ kapatDegistir([b.dataset.ks], b.dataset.k!=='1'); }
  else if(b.id==='gunKapat'){
    const acik = [...document.querySelectorAll('.kslots button')].filter(x=>!x.disabled && x.dataset.k!=='1').map(x=>x.dataset.ks);
    if(acik.length) kapatDegistir(acik, true);
  }
  else if(b.id==='gunAc'){
    const kapali = [...document.querySelectorAll('.kslots button')].filter(x=>x.dataset.k==='1').map(x=>x.dataset.ks);
    if(kapali.length) kapatDegistir(kapali, false);
  }
});

basla();
</script>
</body>
</html>
